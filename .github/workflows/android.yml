
name: Build ChatGB Keyboard APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract fixed Android project
        run: |
          mkdir -p extracted
          unzip -q ChatGBKeyboard-Android-Fixed.zip -d extracted

      - name: Build Android APK
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -1)
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGBKeyboard-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
